<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LECS-chat</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <div class="splash" aria-hidden="true">Starting…</div>

  <section id="signedOut" hidden>
    <div class="landing">
      <div class="landing-card">
        <h1>LECS chat</h1>
        <p class="landing-subtitle">
          Linear Elliptic Curve Signaturing — every message is cryptographically
          signed and verified in your browser.
        </p>
        <button id="signInBtn" type="button" class="primary">
          Sign in with Google
        </button>
      </div>
    </div>
  </section>

  <section id="signedIn" hidden>
    <header class="header">
      <div class="header-user">
        <img id="avatar" alt="" referrerpolicy="no-referrer">
        <span id="greeting">Hello</span>
      </div>
      <div class="header-actions">
        <label class="sign-toggle">
          <span class="sign-toggle-icon" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/>
              <path d="M16.5 3.5a2.121 2.121 0 1 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          </span>
          <span class="sign-toggle-label">Sign messages</span>
          <input id="signToggleBtn" type="checkbox" role="switch"
                 class="switch-input" checked
                 aria-label="Toggle message signing">
          <span class="switch-track" aria-hidden="true">
            <span class="switch-thumb"></span>
          </span>
        </label>
        <button id="signOutBtn" type="button">Sign out</button>
      </div>
    </header>

    <main id="display" class="display"></main>

    <footer class="footer">
      <input id="input" type="text" placeholder="Write a message…" autocomplete="off">
      <button id="sendBtn" type="button" class="primary">Send</button>
    </footer>
  </section>
</body>
</html>
